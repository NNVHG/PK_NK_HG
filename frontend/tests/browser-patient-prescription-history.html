<!doctype html><html lang="vi"><meta charset="UTF-8"><title>Nghiệm thu lịch sử đơn — dữ liệu kiểm thử</title><body><div id="app"></div><script type="module">
import {createApp,h,ref} from 'vue';import {createPinia,setActivePinia} from 'pinia';
import History from '/src/components/PatientPrescriptionHistory.vue';import {useAuthStore} from '/src/stores/auth.ts';import {patientPrescriptionHistoryService as api} from '/src/services/patientPrescriptionHistory.ts';import {prescriptionPrintService} from '/src/services/prescriptionPrint.ts';import {printFixture} from '/tests/prescriptionPrintFixture.mjs';
const pinia=createPinia();setActivePinia(pinia);useAuthStore().$patch({user:{userId:3,roleCode:'DENTIST',fullName:'Nha sĩ đang khám kiểm thử'}});
const all=[9,10].map((id,i)=>({id,patientId:7,visitId:8+i,version:1,prescriptionCode:'RX-20261018-'+(9001+i),createdAt:'2026-10-18T02:00:00Z',doctorName:'Nha sĩ đồng nghiệp kiểm thử',visitDiagnosis:'Chẩn đoán ca tổng hợp kiểm thử',medicineCount:1,isCancelled:i===1,dispensedAt:null,canPrint:i===0}));
api.list=async(id,page)=>({items:all,page:1,pageSize:10,totalCount:2,totalPages:1,hasPreviousPage:false,hasNextPage:false});api.detail=async(id,rx)=>({...all.find(r=>r.id===rx),diagnosis:'Chẩn đoán trên đơn đã lưu kiểm thử',doctorAdvice:'Lời dặn đã lưu kiểm thử',revisitDate:null,items:printFixture().items});
prescriptionPrintService.prepare=async(visitId,rx,version)=>({...printFixture(),prescriptionId:rx,visitId,version,prescriptionCode:'RX-20261018-9001',relativeLookupPath:'/portal/prescriptions/RX-20261018-9001',doctorName:'Nha sĩ đồng nghiệp kiểm thử'});window.print=()=>window.dispatchEvent(new Event('afterprint'));
createApp({setup(){return ()=>h('main',{style:'max-width:850px;margin:auto;font:16px Arial'},[h('h1','Hồ sơ bệnh nhân — tab Đơn thuốc'),h('p','Dữ liệu tổng hợp. Nha sĩ đang phụ trách ca được xem/in đơn của đồng nghiệp; API chỉ thay trong file test.'),h(History,{patientId:7})]);}}).use(pinia).mount('#app');
</script></body></html>
