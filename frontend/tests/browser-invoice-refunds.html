<!doctype html><html lang="vi"><meta charset="UTF-8"><title>Nghiệm thu hoàn tiền — dữ liệu kiểm thử</title><body><div id="app"></div><script type="module">
import{createApp,h}from'vue';import{createPinia,setActivePinia}from'pinia';import Panel from'/src/components/InvoiceRefundPanel.vue';import{useAuthStore}from'/src/stores/auth.ts';import{invoiceRefundsApi as api}from'/src/services/invoiceRefunds.ts';
const pinia=createPinia();setActivePinia(pinia);useAuthStore().$patch({user:{userId:3,roleCode:'ADMIN',fullName:'Admin kiểm thử'},accessToken:'synthetic-test-only'});
let c={invoiceId:7,invoiceCode:'INV-20261018-7001',status:2,snapshot:'A'.repeat(64),totalAmount:'1000000',discountAmount:'0',paidAmount:'600000',remainingAmount:'400000',items:[{id:1,itemType:'Service',code:'A',name:'Dịch vụ A kiểm thử',originalQuantity:1,refundedQuantity:0,remainingQuantity:1,unitPrice:'500000'},{id:2,itemType:'Service',code:'B',name:'Dịch vụ B kiểm thử',originalQuantity:1,refundedQuantity:0,remainingQuantity:1,unitPrice:'500000'}],history:[]},prints=0;
api.read=async()=>JSON.parse(JSON.stringify(c));api.preview=async()=>({preview:'B'.repeat(64),refundAmount:'100000',debtReduction:'400000',totalAfter:'500000',discountAfter:'0',paidAfter:'500000',remainingAfter:'0',fullCancellation:false,requiresLateApproval:false,requiresReserve:false,cashBalance:'600000'});
api.refund=async(id,r)=>{const record={id:11,revision:1,requestId:r.requestId,paymentId:12,voucherCode:'PC-20261018-12',refundAmount:'100000',debtReduction:'400000',totalAfter:'500000',discountAfter:'0',paidAfter:'500000',remainingAfter:'0',reasonCode:r.reasonCode,reasonNotes:r.reasonNotes,paymentMethod:r.paymentMethod,createdAt:new Date().toISOString(),actorName:'Admin kiểm thử'};c={...c,status:5,snapshot:'C'.repeat(64),totalAmount:'500000',paidAmount:'500000',remainingAmount:'0',items:c.items.map(i=>i.id===1?{...i,refundedQuantity:1,remainingQuantity:0}:i),history:[record]};return record;};
api.print=async()=>({record:c.history[0],invoiceCode:c.invoiceCode,clinicName:'Nha khoa kiểm thử',clinicAddress:'Địa chỉ tổng hợp trong test',clinicPhone:'0990000000',patientName:'Bệnh nhân tổng hợp kiểm thử',printNumber:++prints});window.print=()=>window.dispatchEvent(new Event('afterprint'));
createApp({setup(){return()=>h('main',{style:'max-width:780px;margin:24px auto;font:16px Arial;line-height:1.45'},[h('h1','Nghiệm thu hoàn tiền và giảm nợ'),h('p','Chỉ dữ liệu tổng hợp / API thay trong file test. Không chi tiền thật. Tình huống Q-323a: tổng 1.000.000đ, thu 600.000đ, hủy A 500.000đ.'),h(Panel,{invoiceId:7,blocked:false})]);}}).use(pinia).mount('#app');
</script></body></html>
