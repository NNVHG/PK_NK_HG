<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixture ảnh theo răng</title><style>body{font:16px system-ui;margin:1rem;}button,input,select,textarea{font:inherit;}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #2563eb;outline-offset:2px;}</style></head>
<body><h1>Kiểm thử tra cứu ảnh theo răng — dữ liệu tổng hợp</h1><p>Fixture chỉ trong tests; vai trò bệnh nhân tổng hợp, không hồ sơ thật.</p><div id="app"></div><script type="module">
import {createApp,h} from 'vue';import {createPinia} from 'pinia';import {createRouter,createMemoryHistory,RouterView} from 'vue-router';
import ToothImageLookupView from '../src/views/ToothImageLookupView.vue';import {useAuthStore} from '../src/stores/auth';import {apiClient} from '../src/services/api';
const bytes=Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+a7KkAAAAASUVORK5CYII='),c=>c.charCodeAt(0)),blob=new Blob([bytes],{type:'image/png'});
const images=Array.from({length:24},(_,i)=>({id:i+1,patientId:9,visitId:Math.floor(i/3)+11,toothNumber:i<22?85:46,category:'Periapical',originalFileName:`Ảnh răng ${i<22?85:46} số ${i+1}.png`,contentType:'image/png',sizeBytes:bytes.length,width:1,height:1,createdAt:'2026-10-20T00:00:00Z',version:1,notes:'Mô tả tổng hợp',uploadedByFullName:'Nha sĩ tổng hợp'}));
apiClient.defaults.adapter=async config=>{let data;if(config.url==='/dental-images/visit-context/11')data={visitId:11,patientId:9};
else if(config.url==='/dental-images'){const rows=images.filter(i=>config.params.toothNumber==null||i.toothNumber===config.params.toothNumber).filter(i=>!config.params.beforeId||i.id<config.params.beforeId).sort((a,b)=>b.id-a.id);data={items:rows.slice(0,20),hasMore:rows.length>20};}
else if(config.url.endsWith('/file'))data=blob;
else if(config.url.endsWith('/clinical-notes/addenda'))data={items:[],totalCount:0,page:1,pageSize:20,totalPages:0,hasNextPage:false,hasPreviousPage:false};
else if(config.url.endsWith('/clinical-notes'))data={imageId:Number(config.url.split('/')[2]),patientId:9,visitId:11,version:1,clinicalNotes:'Ghi chú tổng hợp',doctorDiagnosis:'Chẩn đoán tổng hợp',updatedByUserId:null,updatedByName:null,updatedAt:null,canReplace:false,canAppend:false};else throw Error('Unexpected fixture request');return{data,status:200,statusText:'OK',headers:{'cache-control':'no-store'},config};};
const router=createRouter({history:createMemoryHistory(),routes:[{path:'/clinical/visits/:visitId/images',component:ToothImageLookupView},{path:'/clinical/visits/:visitId/fdi',component:{render:()=>h('p','Fixture sơ đồ răng')}}]}),pinia=createPinia();useAuthStore(pinia).user={userId:3,roleCode:'PATIENT',roleName:'Bệnh nhân',fullName:'Bệnh nhân tổng hợp'};
const app=createApp({render:()=>h(RouterView)});app.use(pinia);app.use(router);await router.push('/clinical/visits/11/images?toothNumber=85');await router.isReady();app.mount('#app');
</script></body></html>
