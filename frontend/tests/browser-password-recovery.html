<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiểm thử UI khôi phục mật khẩu</title></head>
<body><p>KIỂM THỬ UI — dữ liệu tổng hợp; SMS chỉ là test double trong tệp tests này.</p><div id="app"></div>
<script type="module">
import { createApp, h } from 'vue';
import { createPinia } from 'pinia';
import { createRouter, createMemoryHistory, RouterView } from 'vue-router';
import PasswordRecoveryView from '/src/views/PasswordRecoveryView.vue';
import { apiClient } from '/src/services/api.ts';
apiClient.defaults.adapter = async config => {
  const body = typeof config.data === 'string' ? JSON.parse(config.data) : config.data;
  if (config.url.endsWith('/request')) return {data:{challengeId:'11111111-1111-4111-8111-111111111111',expiresInSeconds:300,resendAfterSeconds:60},status:202,statusText:'Accepted',headers:{},config};
  if (config.url.endsWith('/reset') && body.code === '123456') return {data:{message:'Đã đặt mật khẩu mới.'},status:200,statusText:'OK',headers:{},config};
  throw {response:{data:{message:'Mã không đúng hoặc đã hết hạn.'}}};
};
const router=createRouter({history:createMemoryHistory(),routes:[{path:'/',component:PasswordRecoveryView},{path:'/login',component:{render:()=>h('h1','Trang đăng nhập kiểm thử')}}]});
const app=createApp({render:()=>h(RouterView)});app.use(createPinia());app.use(router);await router.isReady();app.mount('#app');
</script></body></html>
