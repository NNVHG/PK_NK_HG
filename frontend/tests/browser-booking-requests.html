<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo yêu cầu đặt lịch tổng hợp</title><style>body{font:16px system-ui;margin:1rem;}input,select,button,textarea{font:inherit;}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #2563eb;outline-offset:2px;}</style></head><body><h1>Kiểm thử tiếp nhận đặt lịch — dữ liệu tổng hợp</h1><p>Fixture chỉ trong tests, không có hồ sơ thật. Mã mô phỏng: 123456.</p><div id="app"></div><script type="module">
import{createApp,h,ref}from'vue';import{createPinia}from'pinia';import{createRouter,createMemoryHistory,RouterView}from'vue-router';import GuestBookingView from'../src/views/GuestBookingView.vue';import BookingRequestReviewView from'../src/views/BookingRequestReviewView.vue';import{useAuthStore}from'../src/stores/auth';import{apiClient}from'../src/services/api';
const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Ho_Chi_Minh'}).format(new Date()),date=new Date(today+'T00:00:00Z');date.setUTCDate(date.getUTCDate()+1);const tomorrow=date.toISOString().slice(0,10);
const rows=[{id:1,fullName:'Khách mới tổng hợp gửi trước',phone:'0967000001',dateOfBirth:'1990-01-01',appointmentDate:tomorrow,slotTime:'08:00:00',slotDurationMinutes:30,dentistId:null,dentistName:null,notes:'Nội dung tổng hợp',isReturning:false,createdAt:new Date().toISOString(),version:1,status:'Pending'}];
const pinia=createPinia(),auth=useAuthStore(pinia);auth.user=null;
apiClient.defaults.adapter=async config=>{let data;if(config.url==='/appointment-requests/catalog')data={today,slots:['08:00','08:30','09:00'],durationMinutes:30,revision:'A'.repeat(64),dentists:[{dentistId:5,fullName:'Nha sĩ tổng hợp'}]};
else if(config.url==='/patients/mine')data=[{patientId:9,fullName:'Bệnh nhân quay lại tổng hợp',dateOfBirth:'1980-01-01',phone:'0967000000',gender:'Other'}];
else if(config.url==='/appointment-requests/otp')data={challengeId:'11111111-1111-4111-8111-111111111111',expiresInSeconds:300,resendAfterSeconds:60};
else if(config.url==='/appointment-requests'&&config.method==='post'){const body=JSON.parse(config.data),existing=rows.find(r=>r.requestId===body.clientRequestId);if(existing)data={requestId:existing.requestId,status:existing.status};else{const row={...body.intent,id:rows.length+1,requestId:body.clientRequestId,slotDurationMinutes:30,dentistName:null,isReturning:auth.role==='PATIENT'&&body.intent.patientId===9,createdAt:new Date().toISOString(),version:1,status:'Pending'};rows.push(row);data={requestId:row.requestId,status:'Pending'};}}
else if(config.url==='/appointment-requests'){const page=config.params?.page||1,all=rows.filter(r=>r.status==='Pending').sort((a,b)=>Number(b.isReturning)-Number(a.isReturning)||a.id-b.id);data={items:all.slice((page-1)*20,page*20),totalCount:all.length,page,pageSize:20,hasNextPage:all.length>page*20};}
else if(/appointment-requests\/\d+\/approval$/.test(config.url)){const row=rows.find(r=>r.id===Number(config.url.split('/')[2]));data={...row,gender:row.gender||'Other',verifiedPatientId:row.patientId||null,account:{userId:2,fullName:'Gia đình tổng hợp'},patients:row.patientId?[{patientId:row.patientId,fullName:row.fullName,dateOfBirth:row.dateOfBirth,canSelect:true}]:[],requiresCounterConfirmation:!row.patientId,blockReason:row.status==='Pending'?null:'Yêu cầu đã xử lý',reviewStamp:'A'.repeat(64),result:row.approvalResult||null};}
else if(/appointment-requests\/\d+\/approve$/.test(config.url)){const row=rows.find(r=>r.id===Number(config.url.split('/')[2])),body=JSON.parse(config.data);if(row.status!=='Pending'||!body.confirmed||!row.patientId&&!body.confirmedAtCounter)throw Error('Synthetic approval guard');row.status='Approved';row.version++;data=row.approvalResult={appointmentId:100+row.id,patientId:body.patientId||200+row.id,createdAccount:false,requiresPhoneActivation:false};}
else if(/appointment-requests\/\d+\/reject$/.test(config.url)){const id=Number(config.url.split('/')[2]),row=rows.find(r=>r.id===id);row.status='Rejected';row.version++;data=null;}
else throw Error('Unexpected synthetic fixture call');return{data,status:200,statusText:'OK',headers:{'cache-control':'no-store'},config};};
const router=createRouter({history:createMemoryHistory(),routes:[{path:'/book-appointment',component:GuestBookingView},{path:'/appointments/requests',component:BookingRequestReviewView},{path:'/login',component:{render:()=>h('p','Đăng nhập tổng hợp')}}]});
const app=createApp({setup(){const role=ref('');return()=>h('main',[h('label',['Vai trò kiểm thử ',h('select',{value:role.value,onChange:async e=>{role.value=e.target.value;auth.user=role.value?{userId:2,roleCode:role.value,fullName:'Tài khoản tổng hợp',phone:'0967000000'}:null;await router.push(['RECEPTIONIST','ADMIN'].includes(role.value)?'/appointments/requests':'/book-appointment');}},[h('option',{value:''},'Khách chưa có tài khoản'),...['PATIENT','RECEPTIONIST','ADMIN','ASSISTANT'].map(r=>h('option',{value:r},r))])]),h(RouterView)]);}});app.use(pinia);app.use(router);await router.push('/book-appointment');await router.isReady();app.mount('#app');
</script></body></html>
