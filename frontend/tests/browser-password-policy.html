<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiểm thử chính sách mật khẩu</title></head><body><p>KIỂM THỬ UI — dữ liệu tổng hợp, không lưu mật khẩu hoặc gọi backend.</p><div id="app"></div><script type="module">
import{createApp,h}from'vue';import{createPinia}from'pinia';import{createRouter,createMemoryHistory,RouterView}from'vue-router';import{useAuthStore}from'/src/stores/auth.ts';import{apiClient}from'/src/services/api.ts';import ProfileView from'/src/views/ProfileView.vue';import PasswordRecoveryView from'/src/views/PasswordRecoveryView.vue';
const pinia=createPinia(),auth=useAuthStore(pinia);auth.user={userId:1,phone:'0967000000',fullName:'Tài khoản tổng hợp',roleCode:'PATIENT',roleName:'Bệnh nhân'};
apiClient.defaults.adapter=async config=>{let data;if(config.url.endsWith('/request'))data={challengeId:'11111111-1111-4111-8111-111111111111',expiresInSeconds:300,resendAfterSeconds:60};else throw{response:{data:{message:'Fixture chỉ kiểm tra giao diện, không lưu mật khẩu.'}}};return{data,status:202,statusText:'Accepted',headers:{},config};};
const router=createRouter({history:createMemoryHistory(),routes:[{path:'/',component:ProfileView},{path:'/recovery',component:PasswordRecoveryView},{path:'/login',component:{render:()=>h('h1','Đăng nhập kiểm thử')}}]});const app=createApp({render:()=>h('main',[h('nav',[h('button',{onClick:()=>router.push('/')},'Xem đổi mật khẩu'),h('button',{onClick:()=>router.push('/recovery')},'Xem khôi phục')]),h(RouterView)])});app.use(pinia);app.use(router);await router.isReady();app.mount('#app');
</script></body></html>
