<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q351b — Giữ thời hạn phiên sau đổi mật khẩu</title></head><body><div id="app"></div>
<script type="module">
// Test-only adapter. No real account, credential change, JWT, server or persistence.
import{createApp,h}from'vue';import{createPinia}from'pinia';import{createRouter,createMemoryHistory}from'vue-router';
import Profile from'/src/views/ProfileView.vue';import{apiClient}from'/src/services/api';import{useAuthStore}from'/src/stores/auth';
const user={userId:4,roleCode:'PATIENT',roleName:'Bệnh nhân',fullName:'Tài khoản tổng hợp Q351',phone:'0967000000',email:null,dateOfBirth:'2000-01-01',gender:'Other'};
apiClient.defaults.adapter=async config=>{let data={};if(config.url==='/auth/me')data=user;else if(config.url.endsWith('/counter-request'))data={request:null};else if(config.url==='/auth/change-password')data={sessionPolicy:'KeepUntilExpiry',message:'Đổi mật khẩu thành công. Các phiên đang đăng nhập giữ nguyên thời hạn cũ, không được gia hạn. Dùng mật khẩu mới cho lần đăng nhập sau.'};return{data,status:200,statusText:'OK',headers:{},config};};
const router=createRouter({history:createMemoryHistory(),routes:[{path:'/',component:Profile}]});const app=createApp({render:()=>h('main',[h('p','DỮ LIỆU TỔNG HỢP / KHÔNG ĐỔI MẬT KHẨU THẬT. Nhập OldPass1 / NewPass2 để kiểm chứng.'),h(Profile)])});const pinia=createPinia();app.use(pinia);app.use(router);const auth=useAuthStore();auth.user=user;auth.token='synthetic-session-never-sent-to-backend';await router.isReady();app.mount('#app');
</script><style>body{font:16px/1.5 system-ui;background:#f1f5f9;color:#0f172a;margin:0}main{max-width:1150px;margin:auto;padding:1rem}button:focus-visible,input:focus-visible{outline:3px solid #2563eb;outline-offset:2px}</style></body></html>
