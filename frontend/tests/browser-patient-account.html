<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liên kết tài khoản tổng hợp</title><style>body{font:16px system-ui;max-width:65rem;margin:2rem auto;padding:0 1rem;}button,select{font:inherit;padding:.6rem;}button:focus-visible,input:focus-visible{outline:3px solid #2563eb;outline-offset:2px;}</style></head><body><h1>Liên kết hồ sơ vào tài khoản gia đình</h1><p>Dữ liệu tổng hợp kiểm thử. Không có hồ sơ thật.</p><div id="app"></div><script type="module">
import{createApp,h,ref}from'vue';import{createPinia}from'pinia';import PatientAccountLink from'../src/components/PatientAccountLink.vue';import{useAuthStore}from'../src/stores/auth';import{apiClient}from'../src/services/api';
let linked=false;apiClient.defaults.adapter=async config=>{let data;if(config.method==='get')data={patientId:9,patientName:'Bệnh nhân tổng hợp',dateOfBirth:'2010-01-01',phone:'0965000004',isLinked:linked,account:linked?null:{userId:4,fullName:'Đại diện gia đình tổng hợp',phone:'0965000004',dateOfBirth:'1980-01-01'},reviewStamp:linked?null:'A'.repeat(64)};else{linked=true;data={patientId:9,accountUserId:4};}return{data,status:200,statusText:'OK',headers:{'cache-control':'no-store'},config};};
const pinia=createPinia(),auth=useAuthStore(pinia);auth.user={userId:1,roleCode:'RECEPTIONIST',roleName:'Lễ tân',fullName:'Lễ tân tổng hợp'};
createApp({setup(){const role=ref('RECEPTIONIST');return()=>h('main',[h('label',['Vai trò kiểm thử ',h('select',{value:role.value,onChange:e=>{role.value=e.target.value;auth.user={...auth.user,roleCode:role.value};}},['RECEPTIONIST','ADMIN','ASSISTANT'].map(x=>h('option',{value:x},x)))]),h(PatientAccountLink,{patientId:9})]);}}).use(pinia).mount('#app');
</script></body></html>
