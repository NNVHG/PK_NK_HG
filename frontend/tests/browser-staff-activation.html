<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiểm thử tạo và kích hoạt nhân viên</title><style>body{font:16px system-ui;margin:1rem}</style></head><body><p>KIỂM THỬ — dữ liệu tổng hợp; không gọi backend hoặc gửi SMS. OTP mô phỏng: 123456.</p><div id="app"></div><script type="module">
import{createApp,h}from'vue';import{createPinia}from'pinia';import{createRouter,createMemoryHistory,RouterView}from'vue-router';import{useAuthStore}from'/src/stores/auth.ts';import{apiClient}from'/src/services/api.ts';import StaffView from'/src/views/StaffView.vue';import ActivationView from'/src/views/PatientActivationView.vue';
const pinia=createPinia(),auth=useAuthStore(pinia);auth.user={userId:7,fullName:'Admin tổng hợp',roleCode:'ADMIN',roleName:'Admin'};const rows=[];let verified=false;
apiClient.defaults.adapter=async config=>{const body=typeof config.data==='string'?JSON.parse(config.data):config.data;let data;if(config.url==='/staff'&&config.method==='get')data={items:rows,totalCount:rows.length,totalPages:1};else if(config.url==='/staff'&&config.method==='post'&&!body.password){data={...body,userId:22,isActive:true,roleName:'Nha sĩ',requiresPhoneActivation:true};rows.push(data);}else if(config.url==='/auth/activation/request')data={challengeId:'11111111-1111-4111-8111-111111111111',expiresInSeconds:300,resendAfterSeconds:60};else if(config.url==='/auth/activation/verify'&&body.code==='123456'){verified=true;data={completionToken:'A'.repeat(64),expiresInSeconds:300};}else if(config.url==='/auth/activation/complete'&&verified&&body.keepDefaultPassword&&body.confirmed){rows.forEach(r=>r.requiresPhoneActivation=false);verified=false;data={completed:true};}else throw{response:{data:{message:'Thao tác kiểm thử không hợp lệ.'}}};return{data,status:200,statusText:'OK',headers:{'cache-control':'no-store'},config};};
const router=createRouter({history:createMemoryHistory(),routes:[{path:'/',component:StaffView},{path:'/activate-account',component:ActivationView},{path:'/login',component:{render:()=>h('h1','Đăng nhập kiểm thử')}}]});const app=createApp({render:()=>h('main',[h('button',{onClick:async()=>{auth.user=null;await router.push('/activate-account')}},'Chuyển sang nhân viên mới'),h(RouterView)])});app.use(pinia);app.use(router);await router.isReady();app.mount('#app');
</script></body></html>
